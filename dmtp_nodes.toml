# DM-TP node-package manifest.
#
# Declares lab-drivers as an installable DM-TP custom-node package: which repo
# directories go on sys.path, which module DM-TP imports so its @register
# decorators run, and which third-party packages that module needs. See
# docs/automation/custom_nodes.md in the DM-TP repository for the full format.

[package]
name = "lab-drivers"
version = "0.4.0"
api = 1
summary = "Instrument nodes wrapping lab-drivers VISA and serial equipment for DM-TP automation."

[python]
# "src" puts the lab_drivers package on the path; "nodes" puts the node module
# (lab_drivers_nodes) on it.
import_roots = ["src", "nodes"]
# Imported for its @register side effects -- this is what publishes the nodes.
modules = ["lab_drivers_nodes"]
# Installed into the package's private deps prefix. Includes a pure-Python VISA
# backend (pyvisa-py) and mDNS discovery (zeroconf) so a machine without a
# system NI-VISA -- e.g. the automation server -- still has a working VISA
# backend and LAN auto-detection out of the box. When a system NI-VISA is
# present, pyvisa uses it in preference automatically. A serial port driver is
# still required on the machine that talks to serial hardware.
requires = [
    "pyvisa>=1.11",
    "pyvisa-py>=0.7",
    "zeroconf>=0.130",
    "pyserial>=3.5",
    "numpy>=1.22",
    "colorama>=0.4.4",
]

site_name: Lab Drivers API Documentation
site_description: Complete API reference for laboratory measurement and control instruments
site_author: Lab Automation Team
site_url: https://lab-drivers.local

# Theme configuration
theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: blue
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Navigation structure
nav:
  - Home: index.md
  - Install Instructions: install.md
  - API Reference:
    - api/index.md
    - Drivers:
      - DL3021: api/drivers/dl3021.md
      - DMM6500: api/drivers/dmm6500.md
      - DP832: api/drivers/dp832.md
      - FLUKE45: api/drivers/fluke45.md
      - KA3010P: api/drivers/ka3010p.md
      - KS33500B: api/drivers/ks33500b.md
      - Keysight34460A: api/drivers/keysight34460a.md
      - KeysightMSOX4154A: api/drivers/keysightmsox4154a.md
      - RigolDP711: api/drivers/rigoldp711.md
      - RigolDP832: api/drivers/rigoldp832.md
      - RigolDS7034: api/drivers/rigolds7034.md
      - RSA3030: api/drivers/rsa3030.md
      - StanfordPS310: api/drivers/stanfordps310.md
      - U1233A: api/drivers/u1233a.md

# Plugins
plugins:
  - search:
      lang: en
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_object_full_path: false
            docstring_style: numpy
            members_order: source
            merge_init_into_class: true
            filters:
              - "!^_"  # Hide private members

# Markdown extensions
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# Extra CSS
extra_css:
  - css/custom.css

# Extra JavaScript for math rendering
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Footer
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/lab-drivers

# Build options
docs_dir: docs
site_dir: site
strict: false

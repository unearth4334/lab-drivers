[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-drivers"
version = "0.3.3"
description = "Reusable laboratory equipment drivers for VISA and serial instruments"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Lab Data Logging Contributors" }
]
dependencies = [
  "colorama>=0.4.4",
  "numpy>=1.22"
]

[project.optional-dependencies]
visa = ["pyvisa>=1.11"]
serial = ["pyserial>=3.5"]
saleae = ["logic2-automation>=1.0.0"]
lan = ["zeroconf>=0.130"]
plot = ["matplotlib>=3.5"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.30",
  "pymdown-extensions>=10.0"
]
all = [
  "pyvisa>=1.11",
  "pyserial>=3.5",
  "logic2-automation>=1.0.0",
  "zeroconf>=0.130",
  "matplotlib>=3.5",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.30",
  "pymdown-extensions>=10.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

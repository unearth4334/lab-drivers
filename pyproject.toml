[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-drivers"
version = "0.1.0"
description = "Reusable laboratory equipment drivers for VISA and serial instruments"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Lab Data Logging Contributors" }
]
dependencies = [
  "colorama>=0.4.4",
  "numpy>=1.22"
]

[project.optional-dependencies]
visa = ["pyvisa>=1.11"]
serial = ["pyserial>=3.5"]
plot = ["matplotlib>=3.5"]
all = [
  "pyvisa>=1.11",
  "pyserial>=3.5",
  "matplotlib>=3.5"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
